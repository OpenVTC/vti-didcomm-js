name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so the job token is read-only.
# A job that needs more has to ask for it explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` is pinned to a commit SHA. A tag is mutable, so
      # `@v6` means "whatever that tag points at when this job runs" —
      # whoever can move it can run code in this job with the token
      # above. The trailing comment is the version the SHA was, and
      # Dependabot (.github/dependabot.yml) proposes the bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default leaves the job's token in .git/config, where any
          # later step — or a dependency's install script — can read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      # dtolnay/rust-toolchain publishes no release tags; `stable` is a
      # branch. This is that branch's head at the time of pinning, so
      # bumping it is a deliberate edit rather than a silent one.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tools/roundtrip-helper

      # Build the cross-impl helper first. The Rust round-trip tests skip
      # silently if `didcomm-unpack` is absent, so CI must build it or the
      # wire-compatibility coverage is a no-op.
      - name: Build round-trip helper
        run: cargo build --manifest-path tools/roundtrip-helper/Cargo.toml

      - run: npm ci

      - run: npm test

      - name: Type-check (.d.ts generation)
        run: npm run build:types
